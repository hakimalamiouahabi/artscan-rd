name: deploy-cloudflare-staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: artscan-rd-staging
      QUEUE_NAME: artscan-rd-staging-crawl
      WORKER_NAME: artscan-rd-staging
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Quality gate — staging
        run: |
          node --check src/worker.js
          node scripts/verify.mjs

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Ensure D1 staging database
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.D1_NAME);process.stdout.write(d?.uuid||d?.id||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$D1_NAME" --location weur
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.D1_NAME);process.stdout.write(d?.uuid||d?.id||'')")"
          fi
          test -n "$DB_ID"
          echo "ARTSCAN_D1_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Ensure staging crawl queue
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUT="$(npx wrangler queues create "$QUEUE_NAME" 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ] && ! printf '%s' "$OUT" | grep -qi "already taken"; then
            exit "$CODE"
          fi

      - name: Generate staging config
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('wrangler.jsonc','utf8');
          s=s.replace('"name": "artscan-rd"','"name": "artscan-rd-staging"');
          s=s.replace('"database_name": "artscan-rd"','"database_name": "artscan-rd-staging"');
          s=s.replace('REPLACE_AFTER_D1_CREATE',process.env.ARTSCAN_D1_ID);
          s=s.replaceAll('"artscan-rd-crawl"','"artscan-rd-staging-crawl"');
          fs.writeFileSync('wrangler.staging.jsonc',s);
          NODE

      - name: Apply D1 schema and seed
        run: |
          npx wrangler d1 execute "$D1_NAME" --remote --file=schema.sql
          npx wrangler d1 execute "$D1_NAME" --remote --file=seed.generated.sql
          if [ -f corpus-a.generated.sql ]; then
            npx wrangler d1 execute "$D1_NAME" --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
            npx wrangler d1 execute "$D1_NAME" --remote --file=corpus-a.generated.sql
          fi

      - name: Deploy staging Worker
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.staging.jsonc 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          test -n "$URL"
          echo "ARTSCAN_STAGING_URL=$URL" >> "$GITHUB_ENV"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ARTSCAN_STAGING_URL/api/health" > /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!j.ok) throw new Error('health not ok');
          if(j.runtime?.llm!==false) throw new Error('LLM runtime unexpectedly enabled');
          if(j.runtime?.externalSearchApi!==false) throw new Error('External search API unexpectedly enabled');
          if(j.runtime?.httpDirect!==true) throw new Error('Direct HTTP not enabled');
          if(typeof j.corpusAVerified!=='number') throw new Error('Documentary corpus metric missing');
          if(typeof j.corpusASources!=='number') throw new Error('Institutional corpus coverage metric missing');
          console.log(j);
          NODE

      - name: End-to-end research smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "$ARTSCAN_STAGING_URL/api/research" \
            -H 'content-type: application/json' \
            --data '{"topic":"stockage hydrogene hydrures metalliques","context":"solutions existantes performances limites verrous scientifiques et technologiques","depth":"standard"}' \
            > /tmp/research-start.json
          JOB_ID="$(node -e "const j=require('/tmp/research-start.json');if(!j.jobId)process.exit(1);process.stdout.write(j.jobId)")"
          for i in $(seq 1 120); do
            curl -fsS "$ARTSCAN_STAGING_URL/api/research/$JOB_ID" > /tmp/research-result.json
            STATUS="$(node -e "const j=require('/tmp/research-result.json');process.stdout.write(String(j.job?.status||''))")"
            echo "poll=$i status=$STATUS"
            if [ "$STATUS" = "complete" ]; then break; fi
            sleep 5
          done
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/research-result.json','utf8'));
          if(j.job?.status!=='complete') throw new Error('staging research did not complete');
          if(Number(j.job?.processed_sources||0)<1) throw new Error('no source processed');
          if(!Array.isArray(j.evidence)||j.evidence.length<1) throw new Error('no evidence returned');
          if(typeof j.documentary?.selectedDocuments!=='number') throw new Error('selected documentary metric missing');
          if(typeof j.documentary?.corpusVerified!=='number') throw new Error('global Corpus A metric missing');
          if(typeof j.documentary?.corpusSources!=='number') throw new Error('global Corpus A source coverage metric missing');
          // Staging may intentionally carry an incomplete corpus during recertification; production remains gated.
          console.log(JSON.stringify({processed:j.job.processed_sources,evidence:j.evidence.length,documentary:j.documentary},null,2));
          NODE

      - name: Summary
        run: |
          {
            echo "## ARTSCan R&D staging"
            echo "- URL: $ARTSCAN_STAGING_URL"
            echo "- D1: $D1_NAME"
            echo "- Queue: $QUEUE_NAME"
            echo "- Institutional registry: certified 3/3 sources loaded from generated seed"
            echo "- Corpus A: verified V2/V3 documents loaded when corpus-a.generated.sql exists"
            echo "- Expert/production readiness: >=1000 verified Corpus A documents AND >=1000 represented institutional sources"
            if [ -f /tmp/health.json ]; then
              echo ""
              echo '### Health'
              echo '```json'
              cat /tmp/health.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
