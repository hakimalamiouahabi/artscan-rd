name: registry-certification

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,1 1,15 * *"

permissions:
  contents: write

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Gate scheduled refresh at 02:00 Europe/Paris
        id: paris_gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAY="$(TZ=Europe/Paris date +%d)"
          HOUR="$(TZ=Europe/Paris date +%H)"
          if { [ "$DAY" = "01" ] || [ "$DAY" = "15" ]; } && [ "$HOUR" = "02" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No refresh: Europe/Paris local time is $(TZ=Europe/Paris date --iso-8601=seconds)"
          fi

      - uses: actions/checkout@v4
        if: steps.paris_gate.outputs.run == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.paris_gate.outputs.run == 'true'
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.paris_gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Recertify historical seed sources by direct anonymous HTTP
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:seed

      - name: Certify authoritative-directory research sources
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:authoritative

      - name: Certify US public graduate institutions from NCES IPEDS
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:ipeds

      - name: Certify global public research diversity
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:global

      - name: Certify French public higher-education sources from MESR
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:france

      - name: Certify Australian research-grant higher-education providers
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:australia

      - name: Certify Japanese national and public universities from MEXT
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run certify:japan

      - name: Build merged registry and D1 seed
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run build:registry

      - name: Validate 3/3 and unique-host accounting
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run validate:registry

      - name: Harvest verified Corpus A from refreshed registry
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run harvest:corpus-a

      - name: Upload Corpus A coverage diagnostics
        if: steps.paris_gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-a-coverage-diagnostics-${{ github.run_id }}
          path: |
            data/corpus-a-stats.json
            data/corpus-a-misses.json
          retention-days: 30

      - name: Validate Corpus A
        if: steps.paris_gate.outputs.run == 'true'
        run: npm run validate:corpus-a

      - name: Full quality gate
        if: steps.paris_gate.outputs.run == 'true'
        run: |
          node --check src/worker.js
          node --check scripts/harvest-corpus-a.mjs
          node --check scripts/certify-seed-sources.mjs
          node --check scripts/certify-authoritative-directories.mjs
          node --check scripts/certify-global-directories.mjs
          node --check scripts/certify-france-esr.mjs
          node --check scripts/certify-australia-rbg.mjs
          node --check scripts/certify-japan-public-universities.mjs
          node --check scripts/build-registry.mjs
          node --check scripts/validate-registry.mjs
          node --check scripts/validate-corpus-a.mjs
          npm test

      - name: Commit certified registry
        if: steps.paris_gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/artscan-registry-output
          rm -rf "$OUT"
          mkdir -p "$OUT/data"
          cp data/registry-seed-certified.json "$OUT/data/"
          cp data/registry-seed-certified-stats.json "$OUT/data/"
          cp data/registry-authoritative.json "$OUT/data/"
          cp data/registry-authoritative-stats.json "$OUT/data/"
          cp data/registry-ipeds.json "$OUT/data/"
          cp data/registry-ipeds-stats.json "$OUT/data/"
          cp data/registry-global-diversity.json "$OUT/data/"
          cp data/registry-global-diversity-stats.json "$OUT/data/"
          cp data/registry-france-esr.json "$OUT/data/"
          cp data/registry-france-esr-stats.json "$OUT/data/"
          cp data/registry-australia-rbg.json "$OUT/data/"
          cp data/registry-australia-rbg-stats.json "$OUT/data/"
          cp data/registry-japan-public-universities.json "$OUT/data/"
          cp data/registry-japan-public-universities-stats.json "$OUT/data/"
          cp data/source-registry.generated.json "$OUT/data/"
          cp data/registry-stats.json "$OUT/data/"
          cp seed.generated.sql "$OUT/"
          cp data/corpus-a.generated.json "$OUT/data/"
          cp data/corpus-a.generated.csv "$OUT/data/"
          cp data/corpus-a-stats.json "$OUT/data/"
          cp data/corpus-a-misses.json "$OUT/data/"
          cp corpus-a.generated.sql "$OUT/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/data/"* data/
          cp "$OUT/seed.generated.sql" ./
          cp "$OUT/data/corpus-a.generated.json" data/
          cp "$OUT/data/corpus-a.generated.csv" data/
          cp "$OUT/data/corpus-a-stats.json" data/
          cp "$OUT/corpus-a.generated.sql" ./

          git config user.name "artscan-registry-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add data/registry-seed-certified.json data/registry-seed-certified-stats.json data/registry-authoritative.json data/registry-authoritative-stats.json data/registry-ipeds.json data/registry-ipeds-stats.json data/registry-global-diversity.json data/registry-global-diversity-stats.json data/registry-france-esr.json data/registry-france-esr-stats.json data/registry-australia-rbg.json data/registry-australia-rbg-stats.json data/registry-japan-public-universities.json data/registry-japan-public-universities-stats.json data/source-registry.generated.json data/registry-stats.json seed.generated.sql data/corpus-a.generated.json data/corpus-a.generated.csv data/corpus-a-stats.json data/corpus-a-misses.json corpus-a.generated.sql
          if git diff --cached --quiet; then
            echo "No registry changes"
            exit 0
          fi
          git commit -m "data: refresh certified registry and verified Corpus A"
          git push origin HEAD:main

      - name: Sync refreshed registry and Corpus A to staging D1
        if: steps.paris_gate.outputs.run == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save wrangler@4
          npx wrangler d1 execute artscan-rd-staging --remote --file=schema.sql
          npx wrangler d1 execute artscan-rd-staging --remote --file=seed.generated.sql
          npx wrangler d1 execute artscan-rd-staging --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
          npx wrangler d1 execute artscan-rd-staging --remote --file=corpus-a.generated.sql

      - name: Verify staging after scheduled refresh
        if: steps.paris_gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsS "https://artscan-rd-staging.mnin-nbda-beta.workers.dev/api/health" > /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/registry-stats.json','utf8'));
          const c=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          if(!j.ok) throw new Error('Staging health failed');
          if(Number(j.invalidActive||0)!==0) throw new Error('Invalid active source');
          if(Number(j.certifiedInstitutions||0)!==Number(r.certifiedSources||0)) throw new Error('Staging registry mismatch');
          if(Number(j.corpusAVerified||0)!==Number(c.verified_unique_documents||0)) throw new Error('Staging Corpus A mismatch');
          if(Number(j.corpusASources||0)!==Number(c.sources_represented||0)) throw new Error('Staging Corpus A source coverage mismatch');
          if(Number(j.corpusASources||0)<Number(c.target_sources||1000)) throw new Error('Staging Corpus A below 1000 represented sources');
          if(Number(j.corpusAVerified||0)<1000) throw new Error('Staging Corpus A below 1000');
          if(j.runtime?.llm!==false||j.runtime?.externalSearchApi!==false||j.runtime?.httpDirect!==true) throw new Error('Runtime invariant failed');
          console.log(JSON.stringify(j,null,2));
          NODE


      - name: Promote validated registry and Corpus A to production D1
        if: steps.paris_gate.outputs.run == 'true' && github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute artscan-rd --remote --file=schema.sql
          npx wrangler d1 execute artscan-rd --remote --file=seed.generated.sql
          npx wrangler d1 execute artscan-rd --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
          npx wrangler d1 execute artscan-rd --remote --file=corpus-a.generated.sql

      - name: Verify production data after scheduled refresh
        if: steps.paris_gate.outputs.run == 'true' && github.event_name == 'schedule'
        run: |
          set -euo pipefail
          curl -fsS "https://artscan-rd.mnin-nbda-beta.workers.dev/api/health" > /tmp/production-health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/production-health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/registry-stats.json','utf8'));
          const c=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          if(!j.ok) throw new Error('Production health failed');
          if(Number(j.invalidActive||0)!==0) throw new Error('Production contains invalid active source');
          if(Number(j.certifiedInstitutions||0)!==Number(r.certifiedSources||0)) throw new Error('Production registry mismatch');
          if(Number(j.corpusAVerified||0)!==Number(c.verified_unique_documents||0)) throw new Error('Production Corpus A mismatch');
          if(Number(j.corpusASources||0)!==Number(c.sources_represented||0)) throw new Error('Production Corpus A source coverage mismatch');
          if(Number(j.corpusASources||0)<Number(c.target_sources||1000)) throw new Error('Production Corpus A below 1000 represented sources');
          if(Number(j.corpusAVerified||0)<1000) throw new Error('Production Corpus A below 1000');
          if(j.runtime?.llm!==false||j.runtime?.externalSearchApi!==false||j.runtime?.httpDirect!==true) throw new Error('Production runtime invariant failed');
          console.log(JSON.stringify(j,null,2));
          NODE
