name: registry-certification-now-once

on:
  push:
    paths:
      - '.github/manual/registry-certification-now'

permissions:
  contents: write

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recertify and validate registry
        run: npm run certify:registry

      - name: Harvest verified Corpus A
        run: npm run harvest:corpus-a

      - name: Upload certification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artscan-certification-diagnostics-${{ github.run_id }}
          path: |
            data/registry-stats.json
            data/registry-france-esr-stats.json
            data/registry-australia-rbg-stats.json
            data/registry-japan-public-universities-stats.json
            data/corpus-a-stats.json
            data/corpus-a-misses.json
          retention-days: 30

      - name: Validate Corpus A
        run: npm run validate:corpus-a

      - name: Full quality gate
        run: npm test

      - name: Commit certified artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/artscan-certified-output
          rm -rf "$OUT"
          mkdir -p "$OUT/data"
          cp data/registry-seed-certified.json "$OUT/data/"
          cp data/registry-seed-certified-stats.json "$OUT/data/"
          cp data/registry-authoritative.json "$OUT/data/"
          cp data/registry-authoritative-stats.json "$OUT/data/"
          cp data/registry-ipeds.json "$OUT/data/"
          cp data/registry-ipeds-stats.json "$OUT/data/"
          cp data/registry-global-diversity.json "$OUT/data/"
          cp data/registry-global-diversity-stats.json "$OUT/data/"
          cp data/registry-france-esr.json "$OUT/data/"
          cp data/registry-france-esr-stats.json "$OUT/data/"
          cp data/registry-australia-rbg.json "$OUT/data/"
          cp data/registry-australia-rbg-stats.json "$OUT/data/"
          cp data/registry-japan-public-universities.json "$OUT/data/"
          cp data/registry-japan-public-universities-stats.json "$OUT/data/"
          cp data/source-registry.generated.json "$OUT/data/"
          cp data/registry-stats.json "$OUT/data/"
          cp data/corpus-a.generated.json "$OUT/data/"
          cp data/corpus-a.generated.csv "$OUT/data/"
          cp data/corpus-a-stats.json "$OUT/data/"
          cp data/corpus-a-misses.json "$OUT/data/"
          cp seed.generated.sql "$OUT/"
          cp corpus-a.generated.sql "$OUT/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/data/"* data/
          cp "$OUT/seed.generated.sql" ./
          cp "$OUT/corpus-a.generated.sql" ./

          git config user.name "artscan-certification-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add data/registry-seed-certified.json data/registry-seed-certified-stats.json data/registry-authoritative.json data/registry-authoritative-stats.json data/registry-ipeds.json data/registry-ipeds-stats.json data/registry-global-diversity.json data/registry-global-diversity-stats.json data/registry-france-esr.json data/registry-france-esr-stats.json data/registry-australia-rbg.json data/registry-australia-rbg-stats.json data/registry-japan-public-universities.json data/registry-japan-public-universities-stats.json data/source-registry.generated.json data/registry-stats.json data/corpus-a.generated.json data/corpus-a.generated.csv data/corpus-a-stats.json data/corpus-a-misses.json seed.generated.sql corpus-a.generated.sql
          if git diff --cached --quiet; then
            echo "No certified artifact changes"
          else
            git commit -m "data: refresh certified registry and Corpus A"
            git push origin HEAD:main
          fi

      - name: Sync certified registry and Corpus A to staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save wrangler@4
          npx wrangler d1 execute artscan-rd-staging --remote --file=schema.sql
          npx wrangler d1 execute artscan-rd-staging --remote --file=seed.generated.sql
          npx wrangler d1 execute artscan-rd-staging --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
          npx wrangler d1 execute artscan-rd-staging --remote --file=corpus-a.generated.sql

      - name: Verify staging certification
        run: |
          set -euo pipefail
          curl -fsS "https://artscan-rd-staging.mnin-nbda-beta.workers.dev/api/health" > /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/registry-stats.json','utf8'));
          const c=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          if(!h.ok) throw new Error('Staging health failed');
          if(Number(h.invalidActive||0)!==0) throw new Error('Invalid active source on staging');
          if(Number(h.certifiedInstitutions||0)!==Number(r.certifiedSources||0)) throw new Error('Staging registry mismatch');
          if(Number(h.corpusAVerified||0)!==Number(c.verified_unique_documents||0)) throw new Error('Staging Corpus A document mismatch');
          if(Number(h.corpusASources||0)!==Number(c.sources_represented||0)) throw new Error('Staging Corpus A source mismatch');
          if(Number(h.corpusAVerified||0)<1000||Number(h.corpusASources||0)<1000) throw new Error('Staging below Expert 1000/1000');
          if(h.productionReady!==true) throw new Error('Staging productionReady=false');
          console.log(JSON.stringify(h,null,2));
          NODE
