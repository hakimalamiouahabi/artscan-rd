name: deploy-cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: artscan-rd-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: artscan-rd
      QUEUE_NAME: artscan-rd-crawl
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: auth
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Documentary production gate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://artscan-rd-staging.mnin-nbda-beta.workers.dev/api/health" > /tmp/staging-health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/staging-health.json','utf8'));
          if(!j.ok) throw new Error('Staging health is not OK');
          if(Number(j.corpusAVerified||0)<1000) throw new Error('Production blocked: verified Corpus A is '+Number(j.corpusAVerified||0)+'/1000');
          if(Number(j.invalidActive||0)!==0) throw new Error('Production blocked: invalid active institutional sources');
          if(j.runtime?.llm!==false||j.runtime?.externalSearchApi!==false||j.runtime?.httpDirect!==true) throw new Error('Production blocked: runtime invariants failed');
          console.log(j);
          NODE

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Quality gate
        if: steps.auth.outputs.ready == 'true'
        run: node --check src/worker.js && node scripts/verify.mjs

      - name: Install Wrangler
        if: steps.auth.outputs.ready == 'true'
        run: npm install --no-save wrangler@4


      - name: Ensure D1 database
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node -e "const a=require('/tmp/d1.json');const d=a.find(x=>x.name===process.env.D1_NAME);process.stdout.write(d?.uuid||d?.id||'')")"
          if [ -z "$DB_ID" ]; then
            npx wrangler d1 create "$D1_NAME" --location weur
            npx wrangler d1 list --json > /tmp/d1.json
            DB_ID="$(node -e "const a=require('/tmp/d1.json');const d=a.find(x=>x.name===process.env.D1_NAME);process.stdout.write(d?.uuid||d?.id||'')")"
          fi
          test -n "$DB_ID"
          echo "ARTSCAN_D1_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Ensure crawl queue
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUT="$(npx wrangler queues create "$QUEUE_NAME" 2>&1)"
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$CODE" -ne 0 ] && ! printf '%s' "$OUT" | grep -qi "already taken"; then
            exit "$CODE"
          fi

      - name: Generate deploy config
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='wrangler.jsonc';
          let s=fs.readFileSync(p,'utf8');
          if(!process.env.ARTSCAN_D1_ID) throw new Error('Missing ARTSCan D1 id');
          s=s.replace('REPLACE_AFTER_D1_CREATE',process.env.ARTSCAN_D1_ID);
          fs.writeFileSync('wrangler.deploy.jsonc',s);
          NODE

      - name: Apply D1 schema and certified seed
        if: steps.auth.outputs.ready == 'true'
        run: |
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.deploy.jsonc --file=schema.sql
          npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.deploy.jsonc --file=seed.generated.sql
          if [ -f corpus-a.generated.sql ]; then
            npx wrangler d1 execute "$D1_NAME" --remote --config wrangler.deploy.jsonc --file=corpus-a.generated.sql
          fi

      - name: Deploy Worker
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          echo "ARTSCAN_URL=$URL" >> "$GITHUB_ENV"

      - name: Production smoke test
        if: steps.auth.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ARTSCAN_URL:-}" ]; then
            echo "::error::Unable to resolve deployed workers.dev URL"
            exit 1
          fi
          curl -fsS "$ARTSCAN_URL/api/health" > /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/registry-stats.json','utf8'));
          if(!j.ok) throw new Error('production health not ok');
          if(j.runtime?.llm!==false||j.runtime?.externalSearchApi!==false||j.runtime?.httpDirect!==true) throw new Error('runtime invariant failed');
          if(Number(j.invalidActive||0)!==0) throw new Error('invalid active source');
          if(Number(j.certifiedInstitutions||0)!==Number(s.certifiedSources||0)) throw new Error('production registry mismatch');
          if(Number(j.corpusAVerified||0)<1000) throw new Error('production Corpus A below 1000');
          if(j.productionReady!==true) throw new Error('productionReady is false');
          console.log(j);
          NODE

      - name: Deployment summary
        if: steps.auth.outputs.ready == 'true'
        run: |
          {
            echo "## ARTSCan R&D — Cloudflare"
            echo "- URL: $ARTSCAN_URL"
            echo "- D1: $D1_NAME"
            echo "- Queue: $QUEUE_NAME"
            echo "- LLM runtime: 0"
            echo "- Search API runtime: 0"
            echo "- Direct HTTP: enabled"
          } >> "$GITHUB_STEP_SUMMARY"
