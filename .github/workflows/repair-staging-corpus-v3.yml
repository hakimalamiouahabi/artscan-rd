name: repair-staging-corpus-v3

on:
  push:
    paths:
      - '.github/manual/repair-staging-corpus-v3'

permissions:
  contents: write

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_NAME: artscan-rd-staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and rebuild Corpus A SQL
        run: |
          set -euo pipefail
          npm test
          npm run build:corpus-sql
          grep -q 'source_id=excluded.source_id' corpus-a.generated.sql
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          if(Number(c.verified_unique_documents)!==1309) throw new Error('unexpected certified document count');
          if(Number(c.sources_represented)!==1309) throw new Error('unexpected represented-source count');
          NODE
          cp corpus-a.generated.sql /tmp/corpus-a.generated.sql

      - name: Install Wrangler and resolve staging D1
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save wrangler@4 >/dev/null 2>&1
          npx wrangler d1 list --json > /tmp/d1.json
          DB_ID="$(node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));const d=a.find(x=>x.name===process.env.D1_NAME);process.stdout.write(d?.uuid||d?.id||'')")"
          test -n "$DB_ID"
          echo "ARTSCAN_D1_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate staging config
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('wrangler.jsonc','utf8');
          s=s.replace('"name": "artscan-rd"','"name": "artscan-rd-staging"');
          s=s.replace('"database_name": "artscan-rd"','"database_name": "artscan-rd-staging"');
          s=s.replace('REPLACE_AFTER_D1_CREATE',process.env.ARTSCAN_D1_ID);
          s=s.replaceAll('"artscan-rd-crawl"','"artscan-rd-staging-crawl"');
          fs.writeFileSync('wrangler.staging.jsonc',s);
          NODE

      - name: Apply certified data to staging D1
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$D1_NAME" --remote --file=schema.sql
          npx wrangler d1 execute "$D1_NAME" --remote --file=seed.generated.sql
          npx wrangler d1 execute "$D1_NAME" --remote --file=corpus-a.generated.sql

      - name: Deploy current staging Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.staging.jsonc 2>&1 | tee /tmp/deploy.log
          URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/deploy.log | tail -1 || true)"
          test -n "$URL"
          echo "ARTSCAN_STAGING_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify exact staging certification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$ARTSCAN_STAGING_URL/api/health" > /tmp/health.json
          cat /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const r=JSON.parse(fs.readFileSync('data/registry-stats.json','utf8'));
          const c=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          const eq=(a,b,label)=>{if(Number(a)!==Number(b))throw new Error(label+': '+a+' != '+b)};
          if(!h.ok)throw new Error('staging health failed');
          if(h.version!=='4.0.1')throw new Error('staging Worker version mismatch: '+h.version);
          eq(h.invalidActive,0,'invalid active sources');
          eq(h.certifiedInstitutions,r.certifiedSources,'registry sources');
          eq(h.certifiedUniqueHosts,r.certifiedUniqueHosts,'registry unique hosts');
          eq(h.certifiedDistinctOrganisms,r.certifiedDistinctOrganisms,'registry distinct organisms');
          eq(h.corpusAVerified,c.verified_unique_documents,'Corpus A documents');
          eq(h.corpusASources,c.sources_represented,'Corpus A represented sources');
          eq(h.corpusARepresentedHosts,c.represented_source_hosts,'Corpus A represented hosts');
          if(h.productionReady!==true)throw new Error('staging productionReady=false');
          console.log(JSON.stringify({ok:true,health:h},null,2));
          NODE

      - name: Commit rebuilt SQL
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/corpus-a.generated.sql ./corpus-a.generated.sql
          git config user.name "artscan-certification-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add corpus-a.generated.sql
          if git diff --cached --quiet; then
            echo "No generated SQL change"
          else
            git commit -m "data: rebuild Corpus A SQL with current source linkage"
            git push origin HEAD:main
          fi
