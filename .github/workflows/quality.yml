name: quality

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/manual/quality-now'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check src/worker.js
          node --check scripts/harvest-corpus-a.mjs
          node --check scripts/certify-seed-sources.mjs
          node --check scripts/certify-authoritative-directories.mjs
          node --check scripts/certify-global-directories.mjs
          node --check scripts/certify-france-esr.mjs
          node --check scripts/certify-australia-rbg.mjs
          node --check scripts/certify-japan-public-universities.mjs
          node --check scripts/build-registry.mjs
          node --check scripts/run-ipeds.mjs
          node --check scripts/validate-registry.mjs
          node --check scripts/validate-corpus-a.mjs
      - run: npm test
