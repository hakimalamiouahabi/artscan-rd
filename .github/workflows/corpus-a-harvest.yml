name: corpus-a-harvest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check scripts/harvest-corpus-a.mjs

      - name: Harvest verified Corpus A
        run: node scripts/harvest-corpus-a.mjs

      - name: Validate Corpus A
        run: |
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/corpus-a.generated.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/corpus-a-stats.json','utf8'));
          if(a.some(x=>x.corpus!=='A'||x.official!==true||x.public_access!==true||x.free_access!==true||x.primary_secondary!=='primary'||x.access_status!=='free'||!['V2','V3'].includes(x.verification_level))) process.exit(1);
          if(new Set(a.map(x=>x.canonical_hash)).size!==a.length) process.exit(1);
          if(Number(s.verified_unique_documents)!==a.length) process.exit(1);
          if(Number(s.sources_represented||0)<Number(s.target_sources||1000)) process.exit(1);
          if(s.complete!==true) process.exit(1);
          console.log(JSON.stringify(s,null,2));
          NODE

      - name: Commit documentary corpus
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/artscan-corpus-output
          rm -rf "$OUT"
          mkdir -p "$OUT/data"
          cp data/corpus-a.generated.json "$OUT/data/"
          cp data/corpus-a.generated.csv "$OUT/data/"
          cp data/corpus-a-stats.json "$OUT/data/"
          cp corpus-a.generated.sql "$OUT/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/data/"* data/
          cp "$OUT/corpus-a.generated.sql" ./

          git config user.name "artscan-corpus-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add data/corpus-a.generated.json data/corpus-a.generated.csv data/corpus-a-stats.json corpus-a.generated.sql
          if git diff --cached --quiet; then
            echo "No Corpus A changes"
          else
            git commit -m "data: refresh verified Corpus A"
            git push origin HEAD:main
          fi

      - name: Sync Corpus A to staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save wrangler@4
          npx wrangler d1 execute artscan-rd-staging --remote --file=schema.sql
          npx wrangler d1 execute artscan-rd-staging --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
          npx wrangler d1 execute artscan-rd-staging --remote --file=corpus-a.generated.sql
