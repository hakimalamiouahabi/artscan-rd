name: corpus-a-harvest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artscan-rd-staging-d1
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: node --check scripts/harvest-corpus-a.mjs

      - name: Harvest verified Corpus A
        run: npm run harvest:corpus-a

      - name: Upload Corpus A coverage diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: corpus-a-coverage-diagnostics-${{ github.run_id }}
          path: |
            data/corpus-a-stats.json
            data/corpus-a-misses.json
          retention-days: 30

      - name: Validate Corpus A
        run: npm run validate:corpus-a

      - name: Commit documentary corpus
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/artscan-corpus-output
          rm -rf "$OUT"
          mkdir -p "$OUT/data"
          cp data/corpus-a.generated.json "$OUT/data/"
          cp data/corpus-a.generated.csv "$OUT/data/"
          cp data/corpus-a-stats.json "$OUT/data/"
          cp data/corpus-a-misses.json "$OUT/data/"
          cp corpus-a.generated.sql "$OUT/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/data/"* data/
          cp "$OUT/corpus-a.generated.sql" ./

          git config user.name "artscan-corpus-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add data/corpus-a.generated.json data/corpus-a.generated.csv data/corpus-a-stats.json data/corpus-a-misses.json corpus-a.generated.sql
          if git diff --cached --quiet; then
            echo "No Corpus A changes"
          else
            git commit -m "data: refresh verified Corpus A"
            git push origin HEAD:main
          fi

      - name: Sync Corpus A to staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-save wrangler@4
          npx wrangler d1 execute artscan-rd-staging --remote --file=schema.sql
          npx wrangler d1 execute artscan-rd-staging --remote --command "UPDATE documents SET active=0, updated_at=CURRENT_TIMESTAMP WHERE corpus='A' AND active=1;"
          npx wrangler d1 execute artscan-rd-staging --remote --file=corpus-a.generated.sql
