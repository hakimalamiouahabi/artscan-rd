name: global-diversity-certification

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artscan-global-diversity
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Certify official global diversity directories
        run: |
          node --check scripts/certify-global-directories.mjs
          node scripts/certify-global-directories.mjs

      - name: Validate 3/3
        run: |
          node <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/registry-global-diversity.json','utf8'));
          const s=JSON.parse(fs.readFileSync('data/registry-global-diversity-stats.json','utf8'));
          if(a.some(x=>!(x.official&&x.public_access&&x.free_access&&x.active))) process.exit(1);
          if(Number(s.certified)!==a.length) process.exit(1);
          console.log(JSON.stringify(s,null,2));
          NODE

      - name: Commit certified diversity registry
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/artscan-global-diversity
          rm -rf "$OUT"
          mkdir -p "$OUT/data"
          cp data/registry-global-diversity.json "$OUT/data/"
          cp data/registry-global-diversity-stats.json "$OUT/data/"

          git fetch origin main
          git reset --hard origin/main
          cp "$OUT/data/"* data/

          git config user.name "artscan-global-bot"
          git config user.email "132111667+hakimalamiouahabi@users.noreply.github.com"
          git add data/registry-global-diversity.json data/registry-global-diversity-stats.json
          if git diff --cached --quiet; then
            echo "No global diversity changes"
            exit 0
          fi
          git commit -m "data: refresh certified global diversity registry"
          git push origin HEAD:main
